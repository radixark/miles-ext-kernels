[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "miles-ext-kernels"
version = "0.1.0"
description = "Training kernels for miles, consumed as the 3rdparty/miles-ext-kernels submodule"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch", "apache-tvm-ffi>=0.1.11,<0.2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["miles_ext_kernels*"]

# Kernel sources are compiled on first use (or by prebuild), so they ship with the package.
[tool.setuptools.package-data]
"*" = ["*.json", "csrc/**/*"]

[tool.pytest.ini_options]
markers = ["multi_gpu: needs more than one GPU"]

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line_length = 119

[tool.ruff]
line-length = 320
